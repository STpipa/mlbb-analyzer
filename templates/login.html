{% extends "base.html" %}
{% block title %}Ingresar - MLBB Analyzer{% endblock %}
{% block content %}
<div style="max-width:360px; margin:60px auto 0;">
  <h2 style="margin-top:0;">Ingresar</h2>
  {% if error %}
  <p style="color:var(--red); font-size:0.9rem;">{{ error }}</p>
  {% endif %}
  <form method="post" action="/login" style="display:flex; flex-direction:column; gap:12px;">
    <input name="username" placeholder="Usuario" autocomplete="username" required
           style="background:var(--bg-card); border:1px solid var(--border); color:var(--text); padding:10px 12px; border-radius:6px;">
    <input name="password" type="password" placeholder="Contraseña" autocomplete="current-password" required
           style="background:var(--bg-card); border:1px solid var(--border); color:var(--text); padding:10px 12px; border-radius:6px;">
    <button type="submit" style="background:var(--gold); color:#241a05; border:none; padding:10px 18px; border-radius:6px; font-weight:700; cursor:pointer;">
      Entrar
    </button>
  </form>
  <p style="color:var(--text-dim); font-size:0.85rem; margin-top:16px;">
    ¿Todavía no tenés cuenta? <a class="back" href="/registro">Registrate</a>
  </p>
</div>
{% endblock %}
